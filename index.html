<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index,js" defer></script>
    <title>Newsletter sign up form</title>
  </head>
  <body>
    <section class="card">
      <div class="illustration-container">
        <picture
          ><source
            media="(min-width: 1000px)"
            srcset="illustration-sign-up-desktop.svg"
          />
          <source
            media="(min-width: 550px)"
            srcset="illustration-sign-up-tablet.svg"
          />
          <img
            src="illustration-sign-up-mobile.svg"
            alt="Illustration of a graph"
            class="illustration"
          />
        </picture>
      </div>

      <div class="left-container">
        <main>
          <h1 class="text-preset-1-mobile">Stay Updated!</h1>
          <p class="text-preset-2-regular">
            Join 60,000+ product managers receiving monthly updates on:
          </p>
          <ul class="text-preset-2-regular">
            <li>Product discovery and building what matters</li>
            <li>Measuring to ensure updates are a success</li>
            <li>And much more!</li>
          </ul>
        </main>
        <form action="#">
          <div class="label-group">
            <label for="email" class="text-preset-3">Email address</label>
          </div>
          <div class="form-actions">
            <input
              type="email"
              class="text-preset-2-regular email"
              placeholder="email@company.com"
            />
            <button type="submit" class="text-preset-2-bold btn">
              Subscribe to monthly newsletter
            </button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
