<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
    <title>Newsletter</title>
  </head>
  <body>
    <div class="card">
      <img
        class="illustration"
        src="illustration-sign-up-mobile.svg"
        alt="Abstract image with a line chart"
      />
      <section class="content">
        <h1 class="title text-preset-1">Stay Updated</h1>
        <p class="join text-preset-2">
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <ul class="text-preset-2">
          <li>Product discovery and building what matters</li>
          <li>Measuring to ensure updates are a success</li>
          <li>And much more!</li>
        </ul>
        <form action="#">
          <div class="form-group">
            <div class="label-container">
              <label for="email" class="text-preset-3">Email address</label>
              <!-- <p class="text-preset-3 error-text">Valid email required</p> -->
            </div>
            <input
              type="email"
              name="email"
              id="email"
              class="text-preset-2 email"
              placeholder="email@company.com"
            />
          </div>
          <button type="submit" class="text-preset-2-bold submit-btn">
            Subscribe to monthly newsletter
          </button>
        </form>
      </section>
    </div>
  </body>
</html>
